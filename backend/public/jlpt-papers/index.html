<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT真题下载 - 言旅 Kotabi</title>
<link rel="icon" type="image/png" href="/home/app_icon.png">
<style>
:root{--primary:#4361ee;--primary-dark:#2f4ac1;--primary-light:#eef0fd;--surface:#fff;--surface2:#f8f9fc;--border:#e5e7ef;--text:#1a1c2e;--text-sub:#6b7280;--text-hint:#9ca3af;--radius:16px;--radius-sm:8px;--shadow:0 2px 16px rgba(67,97,238,.08);--shadow-md:0 4px 24px rgba(67,97,238,.13);--nav-h:56px;--success:#10b981}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--surface2);line-height:1.6}a{text-decoration:none;color:var(--primary)}a:hover{opacity:.85}
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 clamp(12px,4vw,48px);gap:8px;z-index:100}
nav .logo{font-size:20px;font-weight:800;color:var(--primary);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}nav .logo img{width:32px;height:32px;border-radius:8px}nav .logo sub{font-size:11px;font-weight:400;color:var(--text-sub);margin-left:2px;vertical-align:baseline}nav .spacer{flex:1}.nav-link{font-size:13px;font-weight:600;color:var(--text-sub);padding:5px 10px;border-radius:var(--radius-sm);transition:all .15s;white-space:nowrap}.nav-link:hover{color:var(--primary);background:var(--primary-light)}.nav-link.active{color:var(--primary)}
.user-badge{font-size:13px;font-weight:600;color:var(--primary);padding:5px 12px;border-radius:var(--radius-sm);background:var(--primary-light);cursor:pointer;display:none;align-items:center;gap:4px;white-space:nowrap}.user-badge.show{display:inline-flex}.user-badge .vip-icon{font-size:14px;margin-right:2px}.user-badge.is-member{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#92400e}
.auth-slot{width:148px;min-height:32px;display:flex;justify-content:flex-end;align-items:center;visibility:hidden}body.auth-ready .auth-slot{visibility:visible}.auth-slot .user-badge{max-width:148px;overflow:hidden;text-overflow:ellipsis}
.hero{margin-top:var(--nav-h);padding:48px clamp(16px,6vw,80px) 36px;text-align:center;background:linear-gradient(135deg,#0f0c29 0%,#1a1a4e 40%,#24243e 100%);color:#fff}.hero h1{font-size:clamp(24px,5vw,38px);font-weight:900;margin-bottom:8px}.hero h1 span{background:linear-gradient(90deg,#60a5fa,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.hero p{font-size:clamp(13px,1.8vw,15px);color:rgba(255,255,255,.68);max-width:660px;margin:0 auto}
.container{max-width:1080px;margin:0 auto;padding:32px clamp(12px,4vw,48px) 60px}.login-gate{text-align:center;padding:60px 20px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow)}.login-gate .icon{font-size:48px;margin-bottom:12px}.login-gate h2{font-size:20px;font-weight:800;margin-bottom:8px}.login-gate p{font-size:14px;color:var(--text-sub);margin-bottom:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:none;border-radius:var(--radius-sm);background:var(--primary);color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit}.btn:hover{background:var(--primary-dark)}.btn:disabled{background:var(--border);color:var(--text-hint);cursor:not-allowed}.btn-ghost{background:#fff;color:var(--text);border:1px solid var(--border)}.btn-ghost:hover{background:var(--surface2)}
.resource-layout{display:grid;grid-template-columns:210px 1fr;gap:20px}.panel{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}.panel-title{font-size:14px;font-weight:800;margin-bottom:12px}.levels{display:grid;gap:8px}.level-btn{width:100%;text-align:left;border:1px solid var(--border);background:#fff;border-radius:var(--radius-sm);padding:12px 14px;font-size:15px;font-weight:800;color:var(--text);cursor:pointer}.level-btn.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
.dir-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.dir-card{border:1px solid var(--border);background:#fff;border-radius:var(--radius-sm);padding:12px;text-align:left;cursor:pointer;transition:all .15s}.dir-card:hover{border-color:var(--primary)}.dir-card.active{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}.dir-card h3{font-size:14px}.dir-card p{font-size:12px;color:var(--text-sub);margin-top:4px}.tag{display:inline-flex;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;margin-left:4px}.tag-free{background:#d1fae5;color:#065f46}.tag-member{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#92400e}
.file-list{margin-top:18px;border-top:1px solid var(--border)}.file-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #f1f3f8}.file-name{font-size:14px;font-weight:800}.file-meta{font-size:12px;color:var(--text-sub);margin-top:3px}.empty{text-align:center;color:var(--text-hint);padding:34px 12px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center}.modal-overlay.show{display:flex}.modal{background:var(--surface);border-radius:var(--radius);padding:32px 28px;width:100%;max-width:400px;margin:16px;box-shadow:0 8px 40px rgba(0,0,0,.2);position:relative}.modal h2{font-size:20px;font-weight:800;margin-bottom:4px}.modal .subtitle{font-size:13px;color:var(--text-sub);margin-bottom:20px}.tabs{display:flex;gap:4px;margin-bottom:20px}.tab{flex:1;padding:8px;text-align:center;font-size:13px;font-weight:600;border:none;background:var(--surface2);color:var(--text-sub);border-radius:var(--radius-sm);cursor:pointer}.tab.active{background:var(--primary);color:#fff}.form-group{margin-bottom:14px}.form-group label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:var(--text-sub)}.form-group input,.form-group select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;outline:none;background:var(--surface);font-family:inherit}.form-group input:focus{border-color:var(--primary)}.form-error{font-size:12px;color:#ef4444;margin-top:16px;display:none;text-align:center}.form-error.show{display:block}.modal-btn{width:100%;padding:11px;border:none;border-radius:var(--radius-sm);background:var(--primary);color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;font-family:inherit}.modal-close{position:absolute;top:10px;right:14px;background:none;border:none;font-size:20px;color:var(--text-hint);cursor:pointer}.spinner-sm{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:4px}@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;color:#fff;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}.toast.show{opacity:1}.toast-success{background:var(--success)}.toast-error{background:#ef4444}
footer{text-align:center;padding:28px 16px;font-size:12px;color:var(--text-hint);border-top:1px solid var(--border);margin-top:48px}
@media(max-width:820px){.resource-layout{grid-template-columns:1fr}nav{overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}.nav-link{display:inline-flex;flex:0 0 auto}.file-row{grid-template-columns:1fr}}
@media(max-width:520px){nav{padding:0 8px;gap:2px;overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav .logo{font-size:18px;gap:5px;flex:0 0 auto}nav .logo img{width:28px;height:28px}nav .logo sub{display:none}nav .spacer{display:none}.nav-link{font-size:12px;padding:5px 7px;flex:0 0 auto}.auth-slot{width:auto;min-width:0;flex:0 0 auto}.auth-slot .user-badge{max-width:92px}}
</style>
</head>
<body>
<nav>
  <a class="logo" href="/"><img src="/home/app_icon.png" alt="言旅">言旅<sub>Kotabi</sub></a>
  <div class="spacer"></div>
  <a class="nav-link" href="/">首页</a>
  <a class="nav-link" href="/membership">会员</a>
  <a class="nav-link" href="/tools">工具箱</a>
  <a class="nav-link active" href="/jlpt">JLPT真题</a>
  <a class="nav-link" href="/support">支持</a>
  <div class="auth-slot">
    <span class="user-badge" id="userBadge" onclick="showUserMenu()"></span>
    <a class="nav-link" id="loginBtn" href="javascript:void(0)" onclick="showAuthModal()">登录</a>
  </div>
</nav>

<section class="hero">
  <h1>JLPT <span>真题下载</span></h1>
  <p>登录后可查看 N1-N5 历年真题，按年份与 7月 / 12月场次下载文件。</p>
</section>

<main class="container">
  <section id="loginGate" class="login-gate" style="display:none">
    <div class="icon">📝</div>
    <h2>登录后查看 JLPT 真题</h2>
    <p>使用言旅账号登录后即可进入真题目录。会员目录会自动校验会员状态。</p>
    <button class="btn" onclick="showAuthModal()">登录 / 注册</button>
  </section>

  <section id="resourceApp" class="resource-layout" style="display:none">
    <aside class="panel">
      <div class="panel-title">级别</div>
      <div class="levels" id="levels"></div>
    </aside>
    <section class="panel">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px">
        <div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <button class="btn btn-ghost" id="backBtn" onclick="backToDirs()" style="display:none;padding:7px 12px">返回上一级</button>
            <div style="font-size:20px;font-weight:900" id="currentTitle">N1</div>
          </div>
          <div style="font-size:13px;color:var(--text-sub)" id="currentSub">选择年份目录后下载单个文件</div>
        </div>
      </div>
      <div class="dir-grid" id="dirs"></div>
      <div class="file-list" id="files"></div>
    </section>
  </section>
</main>

<footer>© 2026 言旅 Kotabi · <a href="/app/terms.html">用户协议</a> · <a href="/app/privacy.html">隐私政策</a></footer>

<div class="modal-overlay" id="authModal">
  <div class="modal">
    <button class="modal-close" onclick="closeAuthModal()">×</button>
    <h2 id="authTitle">登录账号</h2>
    <p class="subtitle" id="authSubtitle">登录后查看会员状态</p>
    <div class="tabs">
      <button class="tab active" id="tabLogin" onclick="switchTab('login')">密码登录</button>
      <button class="tab" id="tabCodeLogin" onclick="switchTab('codeLogin')">验证码登录</button>
      <button class="tab" id="tabRegister" onclick="switchTab('register')">注册</button>
    </div>
    <form id="authForm" onsubmit="handleAuth(event)">
      <div class="form-group" id="usernameGroup" style="display:none"><label>用户名</label><input type="text" id="regUsername" placeholder="3-50 个字符" autocomplete="username"></div>
      <div class="form-group">
        <label>邮箱</label>
        <div style="display:flex;gap:6px">
          <input type="text" id="authEmail" placeholder="请输入邮箱前缀" required autocomplete="email" style="flex:1">
          <select id="emailSuffix" style="width:auto;min-width:120px"><option value="">邮箱</option><option>@gmail.com</option><option>@outlook.com</option><option>@qq.com</option><option>@163.com</option><option>@126.com</option><option>@yahoo.com</option><option>@hotmail.com</option><option>@icloud.com</option></select>
        </div>
      </div>
      <div class="form-group" id="passwordGroup"><label>密码</label><input type="password" id="authPassword" placeholder="至少 8 位" minlength="8" autocomplete="current-password"></div>
      <div class="form-group" id="loginCodeGroup" style="display:none"><label>验证码</label><div style="display:flex;gap:6px"><input type="text" id="loginCode" placeholder="6 位验证码" maxlength="6" style="flex:1"><button type="button" class="btn btn-ghost" id="sendLoginCodeBtn" onclick="sendLoginCodeWeb()">发送验证码</button></div></div>
      <div class="form-group" id="registerCodeGroup" style="display:none"><label>邮箱验证码</label><div style="display:flex;gap:6px"><input type="text" id="registerCode" placeholder="6 位验证码" maxlength="6" style="flex:1"><button type="button" class="btn btn-ghost" id="sendRegisterCodeBtn" onclick="sendRegisterCodeWeb()">发送验证码</button></div></div>
      <div class="form-error" id="authError"></div>
      <button type="submit" class="modal-btn" id="authSubmitBtn">登录</button>
    </form>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const API='/api/v1';
const levelList=['N1','N2','N3','N4','N5'];
let accessToken=localStorage.getItem('kotabi_token');
let refreshTokenStr=localStorage.getItem('kotabi_refresh');
let currentUser=null;
let dirs=[];
let activeLevel='N1';
let activeDir=null;
let activeFiles=[];
let viewMode='dirs';
let authMode='login';

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function fmtSize(n){n=Number(n||0);if(n>=1048576)return(n/1048576).toFixed(1)+' MB';if(n>=1024)return(n/1024).toFixed(1)+' KB';return n+' B'}
function showToast(msg,type='success'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast toast-'+type+' show';setTimeout(()=>t.classList.remove('show'),3000)}

async function apiCall(method,path,body){
  const headers={'Content-Type':'application/json'};
  if(accessToken)headers.Authorization='Bearer '+accessToken;
  const opts={method,headers};
  if(body&&method!=='GET')opts.body=JSON.stringify(body);
  let res=await fetch(API+path,opts);
  if(res.status===401&&refreshTokenStr){
    const rr=await fetch(API+'/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refreshToken:refreshTokenStr})});
    if(rr.ok){const rd=await rr.json();accessToken=rd.accessToken;localStorage.setItem('kotabi_token',accessToken);headers.Authorization='Bearer '+accessToken;res=await fetch(API+path,opts)}
    else{logout();throw new Error('SESSION_EXPIRED')}
  }
  const data=await res.json();
  if(!res.ok)throw new Error(data.message||data.error||'Request failed');
  return data;
}
function getAuthEmail(){const p=document.getElementById('authEmail').value.trim();const s=document.getElementById('emailSuffix').value;if(!p)return'';return p.includes('@')?p:p+s}
function showAuthModal(){document.getElementById('authModal').classList.add('show');document.getElementById('authError').classList.remove('show');switchTab('login')}
function closeAuthModal(){document.getElementById('authModal').classList.remove('show')}
function switchTab(mode){authMode=mode;document.getElementById('tabLogin').classList.toggle('active',mode==='login');document.getElementById('tabCodeLogin').classList.toggle('active',mode==='codeLogin');document.getElementById('tabRegister').classList.toggle('active',mode==='register');document.getElementById('usernameGroup').style.display=mode==='register'?'':'none';document.getElementById('passwordGroup').style.display=mode==='codeLogin'?'none':'';document.getElementById('loginCodeGroup').style.display=mode==='codeLogin'?'':'none';document.getElementById('registerCodeGroup').style.display=mode==='register'?'':'none';document.getElementById('authSubmitBtn').textContent=mode==='register'?'注册':'登录';document.getElementById('authTitle').textContent=mode==='register'?'注册账号':'登录账号';document.getElementById('authError').classList.remove('show')}
async function handleAuth(e){e.preventDefault();const btn=document.getElementById('authSubmitBtn');const err=document.getElementById('authError');err.classList.remove('show');btn.disabled=true;btn.innerHTML='<span class="spinner-sm"></span>'+(authMode==='register'?'注册中...':'登录中...');try{const email=getAuthEmail();let data;if(authMode==='register'){const username=document.getElementById('regUsername').value.trim();const password=document.getElementById('authPassword').value;const code=document.getElementById('registerCode').value.trim();data=await apiCall('POST','/auth/register',{username,email,password,code,platform:'web'});}else if(authMode==='codeLogin'){const code=document.getElementById('loginCode').value.trim();data=await apiCall('POST','/auth/login-with-code',{email,code,platform:'web'});}else{const password=document.getElementById('authPassword').value;data=await apiCall('POST','/auth/login',{email,password,platform:'web'});}accessToken=data.accessToken;refreshTokenStr=data.refreshToken;localStorage.setItem('kotabi_token',accessToken);localStorage.setItem('kotabi_refresh',refreshTokenStr);currentUser=data.user;closeAuthModal();showToast(authMode==='register'?'注册成功':'登录成功');await load();}catch(ex){err.textContent=ex.message;err.classList.add('show')}finally{btn.disabled=false;btn.textContent=authMode==='register'?'注册':'登录'}}
async function sendLoginCodeWeb(){await sendCode('/auth/send-login-code','sendLoginCodeBtn')}
async function sendRegisterCodeWeb(){await sendCode('/auth/send-register-code','sendRegisterCodeBtn')}
async function sendCode(path,id){const email=getAuthEmail();if(!email)return showToast('请输入邮箱','error');const btn=document.getElementById(id);btn.disabled=true;btn.textContent='发送中...';try{await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})}).then(async r=>{if(!r.ok){const d=await r.json();throw new Error(d.error||'发送失败')}});showToast('验证码已发送');let n=60;const iv=setInterval(()=>{n--;btn.textContent=n+'s';if(n<=0){clearInterval(iv);btn.disabled=false;btn.textContent='重新发送'}},1000)}catch(e){showToast(e.message,'error');btn.disabled=false;btn.textContent='发送验证码'}}
function logout(){accessToken=null;refreshTokenStr=null;currentUser=null;localStorage.removeItem('kotabi_token');localStorage.removeItem('kotabi_refresh');renderAuth();updateUI()}
function showUserMenu(){if(confirm('确定退出登录？'))logout()}
function updateUI(){const loginBtn=document.getElementById('loginBtn');const badge=document.getElementById('userBadge');document.body.classList.add('auth-ready');if(currentUser){loginBtn.style.display='none';badge.classList.add('show');if(currentUser.is_member){badge.classList.add('is-member');badge.innerHTML='<span class="vip-icon">👑</span>'+esc(currentUser.username||currentUser.email)}else{badge.classList.remove('is-member');badge.textContent=currentUser.username||currentUser.email}}else{loginBtn.style.display='';badge.classList.remove('show','is-member')}}

async function load(){if(!accessToken)return renderAuth();try{currentUser=(await apiCall('GET','/auth/me')).user;dirs=(await apiCall('GET','/jlpt-resources/directories')).data||[];updateUI();renderApp()}catch(e){logout()}}
function renderAuth(){updateUI();document.getElementById('loginGate').style.display='';document.getElementById('resourceApp').style.display='none'}
function renderApp(){document.getElementById('loginGate').style.display='none';document.getElementById('resourceApp').style.display='grid';document.getElementById('levels').innerHTML=levelList.map(l=>`<button class="level-btn ${l===activeLevel?'active':''}" onclick="selectLevel('${l}')">${l}</button>`).join('');renderDirs()}
function selectLevel(level){activeLevel=level;activeDir=null;viewMode='dirs';renderApp()}
function renderDirs(){viewMode='dirs';const list=dirs.filter(d=>d.level===activeLevel&&Number(d.file_count||0)>0);document.getElementById('backBtn').style.display='none';document.getElementById('currentTitle').textContent=activeLevel;document.getElementById('currentSub').textContent='选择年份目录后下载单个文件';document.getElementById('files').innerHTML='';document.getElementById('dirs').style.display='grid';document.getElementById('dirs').innerHTML=list.length?list.map(d=>`<button class="dir-card" onclick="selectDir('${d.id}')"><h3>${d.year}年${d.session==='07'?'7月':'12月'} ${d.membership_required?'<span class="tag tag-member">会员</span>':'<span class="tag tag-free">免费</span>'}</h3><p>${d.file_count||0} 个文件</p></button>`).join(''):'<div class="empty" style="grid-column:1/-1">当前级别暂无已上传的真题目录</div>'}
function selectDir(id){activeDir=dirs.find(d=>d.id===id);viewMode='files';renderFiles()}
function backToDirs(){activeDir=null;activeFiles=[];renderDirs()}
async function renderFiles(){const box=document.getElementById('files');const dirsEl=document.getElementById('dirs');if(!activeDir){renderDirs();return}dirsEl.style.display='none';document.getElementById('backBtn').style.display='inline-flex';document.getElementById('currentTitle').textContent=`${activeDir.level} ${activeDir.year}年${activeDir.session==='07'?'7月':'12月'}`;document.getElementById('currentSub').textContent='当前目录文件';box.innerHTML='<div class="empty">加载文件...</div>';try{const res=await apiCall('GET',`/jlpt-resources/files?level=${activeDir.level}&year=${activeDir.year}&session=${activeDir.session}`);activeFiles=res.data||[];const dir=res.directory||activeDir;if(!activeFiles.length){box.innerHTML='<div class="empty">当前目录暂无文件</div>';return}box.innerHTML=activeFiles.map(f=>`<div class="file-row"><div><div class="file-name">${esc(f.original_name)}</div><div class="file-meta">${fmtSize(f.file_size)}${dir.membership_required?' · 会员目录':''}</div></div><button class="btn" ${f.can_download?'':'disabled'} onclick="downloadFile('${f.id}')">${f.can_download?'下载':'会员可下载'}</button></div>`).join('')}catch(e){box.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
async function downloadFile(id){const name=(activeFiles.find(f=>f.id===id)||{}).original_name||'jlpt-file';const res=await fetch(`${API}/jlpt-resources/files/${id}/download`,{headers:{Authorization:'Bearer '+accessToken}});if(!res.ok){let msg='下载失败';try{const d=await res.json();msg=d.message||d.error||msg}catch{};showToast(msg,'error');return}const blob=await res.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}
load();
</script>
</body>
</html>
