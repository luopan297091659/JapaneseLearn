<style>
:root {
  --primary: #4361ee;
  --primary-dark: #2f4ac1;
  --primary-light: #eef0fd;
  --surface: #ffffff;
  --surface2: #f8f9fc;
  --border: #e5e7ef;
  --text: #1a1c2e;
  --text-sub: #6b7280;
  --text-hint: #9ca3af;
  --radius: 16px;
  --radius-sm: 8px;
  --shadow: 0 2px 16px rgba(67,97,238,.08);
  --shadow-md: 0 4px 24px rgba(67,97,238,.13);
  --nav-h: 56px;
  --danger: #ef4444;
  --success: #10b981;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif; color: var(--text); background: var(--surface2); line-height: 1.6; }
a { text-decoration: none; color: var(--primary); }
a:hover { opacity: .85; }

/* ── Nav ── */
nav {
  position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h);
  background: rgba(255,255,255,.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border); display: flex; align-items: center;
  padding: 0 clamp(12px,4vw,48px); gap: 8px; z-index: 100;
}
nav .logo { font-size: 20px; font-weight: 800; color: var(--primary); cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
nav .logo img { width: 32px; height: 32px; border-radius: 8px; }
nav .logo sub { font-size: 11px; font-weight: 400; color: var(--text-sub); margin-left: 2px; vertical-align: baseline; }
nav .spacer { flex: 1; }
nav .nav-link {
  font-size: 13px; font-weight: 600; color: var(--text-sub); padding: 5px 10px;
  border-radius: var(--radius-sm); transition: all .15s; white-space: nowrap;
}
nav .nav-link:hover { color: var(--primary); background: var(--primary-light); }
nav .nav-link.active { color: var(--primary); }

/* ── Hero ── */
.hero {
  margin-top: var(--nav-h); padding: 40px clamp(16px,6vw,80px) 30px;
  text-align: center;
  background: linear-gradient(135deg, #0f0c29 0%, #1a1a4e 40%, #24243e 100%);
  color: #fff;
}
.hero h1 { font-size: clamp(22px,4vw,36px); font-weight: 900; margin-bottom: 8px; }
.hero h1 span {
  background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.hero p { font-size: clamp(13px,1.8vw,15px); color: rgba(255,255,255,.65); max-width: 600px; margin: 0 auto; }

/* ── Layout ── */
.container { max-width: 1200px; margin: 0 auto; padding: 24px clamp(12px,4vw,48px) 60px; }
.main-grid { display: grid; grid-template-columns: 340px 1fr; gap: 24px; }
@media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }

/* ── Panel ── */
.panel {
  background: var(--surface); border-radius: var(--radius); padding: 20px;
  box-shadow: var(--shadow); height: fit-content;
}
.panel-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
.panel-title .icon { font-size: 18px; }

/* ── Form ── */
.form-group { margin-bottom: 14px; }
.form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 4px; }
.form-input, .form-select {
  width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 13px; outline: none; transition: border .15s; background: var(--surface);
  font-family: inherit;
}
.form-input:focus, .form-select:focus { border-color: var(--primary); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.color-row { display: flex; align-items: center; gap: 8px; }
.color-row input[type="color"] { width: 36px; height: 36px; border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; padding: 2px; }
.color-row input[type="text"] { flex: 1; }

/* ── Checkbox ── */
.check-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.check-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary); }
.check-row label { font-size: 13px; color: var(--text-sub); cursor: pointer; }

/* ── Device chips ── */
.device-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip {
  padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 600;
  border: 1.5px solid var(--border); cursor: pointer; transition: all .15s;
  user-select: none; color: var(--text-sub); background: var(--surface);
}
.chip:hover { border-color: var(--primary); color: var(--primary); }
.chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.chip-group-label { font-size: 11px; font-weight: 700; color: var(--text-hint); text-transform: uppercase; width: 100%; margin-top: 4px; }

/* ── Upload ── */
.upload-zone {
  border: 2px dashed var(--border); border-radius: var(--radius); padding: 32px 16px;
  text-align: center; cursor: pointer; transition: all .2s; position: relative;
  background: var(--surface2);
}
.upload-zone:hover, .upload-zone.dragover { border-color: var(--primary); background: var(--primary-light); }
.upload-zone .icon { font-size: 36px; margin-bottom: 8px; }
.upload-zone p { font-size: 13px; color: var(--text-sub); }
.upload-zone small { font-size: 11px; color: var(--text-hint); }
.upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* ── Thumbnail grid ── */
.thumb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin-top: 12px; }
.thumb-item { position: relative; border-radius: var(--radius-sm); overflow: hidden; aspect-ratio: 9/16; background: #f0f0f0; }
.thumb-item img { width: 100%; height: 100%; object-fit: cover; }
.thumb-remove {
  position: absolute; top: 2px; right: 2px; width: 20px; height: 20px;
  background: rgba(0,0,0,.6); color: #fff; border: none; border-radius: 50%;
  font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity .15s;
}
.thumb-item:hover .thumb-remove { opacity: 1; }

/* ── Buttons ── */
.btn {
  padding: 10px 20px; border: none; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 700; cursor: pointer; transition: all .15s;
  display: inline-flex; align-items: center; gap: 6px; font-family: inherit;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.btn-secondary { background: var(--surface2); color: var(--text-sub); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-danger { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
.btn-danger:hover { background: #fee2e2; }
.btn-block { width: 100%; justify-content: center; }
.btn-group { display: flex; gap: 8px; margin-top: 16px; }

/* ── Preview ── */
.preview-area { min-height: 400px; display: flex; flex-direction: column; }
.preview-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.preview-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.preview-tab {
  padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
  border: 1.5px solid var(--border); cursor: pointer; transition: all .15s;
  background: var(--surface); color: var(--text-sub);
}
.preview-tab:hover { border-color: var(--primary); }
.preview-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.preview-canvas-wrap {
  flex: 1; display: flex; align-items: center; justify-content: center;
  background: repeating-conic-gradient(#e5e7ef 0% 25%, transparent 0% 50%) 50% / 20px 20px;
  border-radius: var(--radius); overflow: hidden; min-height: 300px; position: relative;
}
.preview-canvas-wrap canvas {
  max-width: 100%; max-height: 600px; border-radius: 4px;
  box-shadow: 0 4px 20px rgba(0,0,0,.15);
}
.preview-empty { text-align: center; color: var(--text-hint); font-size: 14px; padding: 60px 20px; }
.preview-empty .icon { font-size: 48px; margin-bottom: 12px; opacity: .4; }

/* ── Progress ── */
.progress-bar { width: 100%; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 12px; display: none; }
.progress-bar.show { display: block; }
.progress-bar-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width .2s; width: 0; }
.progress-text { font-size: 12px; color: var(--text-sub); margin-top: 4px; text-align: center; display: none; }
.progress-text.show { display: block; }

/* ── Toast ── */
.toast {
  position: fixed; top: 72px; left: 50%; transform: translateX(-50%);
  padding: 10px 20px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600;
  color: #fff; z-index: 300; opacity: 0; transition: opacity .3s; pointer-events: none;
}
.toast.show { opacity: 1; }
.toast-success { background: var(--success); }
.toast-error { background: var(--danger); }

/* ── Footer ── */
footer {
  text-align: center; padding: 28px 16px; font-size: 12px; color: var(--text-hint);
  border-top: 1px solid var(--border); margin-top: 48px;
}
footer a { color: var(--text-hint); }

/* ── Auth gate ── */
.auth-gate {
  text-align: center; padding: 60px 20px; max-width: 480px; margin: 40px auto;
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
}
.auth-gate .icon { font-size: 48px; margin-bottom: 12px; }
.auth-gate h2 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
.auth-gate p { font-size: 14px; color: var(--text-sub); margin-bottom: 20px; }
.auth-gate .gate-btn {
  padding: 12px 32px; border: none; border-radius: var(--radius-sm);
  background: var(--primary); color: #fff; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: all .15s; font-family: inherit;
}
.auth-gate .gate-btn:hover { background: var(--primary-dark); }
.user-badge { font-size: 13px; font-weight: 600; color: var(--primary); padding: 5px 12px; border-radius: var(--radius-sm); background: var(--primary-light); cursor: pointer; display: none; align-items: center; gap: 4px; white-space: nowrap; }
.user-badge.show { display: inline-flex; }

/* ── Responsive ── */
@media (max-width: 900px) {
  .main-grid { grid-template-columns: 1fr; }
  .preview-canvas-wrap canvas { max-height: 400px; }
}
</style>
</head>

<script>
// ============================================================
// Device Specs
// ============================================================
const DEVICE_SPECS = {
  iphone67:            { name: 'iPhone 6.7"', size: [1320,2868], cat: 'iPhone' },
  iphone65:            { name: 'iPhone 6.5"', size: [1242,2688], cat: 'iPhone' },
  iphone61_super:      { name: 'iPhone 6.1" SR', size: [1206,2622], cat: 'iPhone' },
  iphone61:            { name: 'iPhone 6.1"', size: [1170,2532], cat: 'iPhone' },
  iphone55:            { name: 'iPhone 5.5"', size: [1242,2208], cat: 'iPhone' },
  ipad129:             { name: 'iPad 12.9"', size: [2048,2732], cat: 'iPad' },
  ipad129_6th:         { name: 'iPad 12.9" 6th', size: [2064,2752], cat: 'iPad' },
  ipad11:              { name: 'iPad 11"', size: [1668,2388], cat: 'iPad' },
  ipad109:             { name: 'iPad 10.9"', size: [1640,2360], cat: 'iPad' },
  ipad97:              { name: 'iPad 9.7"', size: [1536,2048], cat: 'iPad' },
};

const PRESETS = {
  required: ['iphone67','iphone65','iphone55','ipad129'],
  iphone_all: ['iphone67','iphone65','iphone61_super','iphone61','iphone55'],
  ipad_all: ['ipad129','ipad129_6th','ipad11','ipad109','ipad97'],
};

// ============================================================
// State
// ============================================================
let sourceImages = [];       // [{file, img, name}]
let selectedDevices = new Set(['iphone67','iphone65','iphone55','ipad129']);
let currentPreviewDevice = 'iphone67';
let currentPreviewIndex = 0;
let generatedResults = [];   // [{deviceKey, imgName, blob, dataUrl}]

// ============================================================
// Init device chips
// ============================================================
function initDeviceChips() {
  const container = document.getElementById('deviceChips');
  let lastCat = '';
  for (const [key, spec] of Object.entries(DEVICE_SPECS)) {
    if (spec.cat !== lastCat) {
      lastCat = spec.cat;
      const lbl = document.createElement('div');
      lbl.className = 'chip-group-label';
      lbl.textContent = spec.cat;
      container.appendChild(lbl);
    }
    const chip = document.createElement('span');
    chip.className = 'chip' + (selectedDevices.has(key) ? ' active' : '');
    chip.textContent = spec.name;
    chip.dataset.key = key;
    chip.onclick = () => toggleDevice(key, chip);
    container.appendChild(chip);
  }
}

function toggleDevice(key, chip) {
  if (selectedDevices.has(key)) { selectedDevices.delete(key); chip.classList.remove('active'); }
  else { selectedDevices.add(key); chip.classList.add('active'); }
  updatePreviewTabs();
  updatePreview();
}

function selectPreset(name) {
  selectNone();
  for (const k of PRESETS[name]) { selectedDevices.add(k); }
  refreshChips();
}
function selectAll() { for (const k of Object.keys(DEVICE_SPECS)) selectedDevices.add(k); refreshChips(); }
function selectNone() { selectedDevices.clear(); refreshChips(); }
function refreshChips() {
  document.querySelectorAll('#deviceChips .chip').forEach(c => {
    c.classList.toggle('active', selectedDevices.has(c.dataset.key));
  });
  updatePreviewTabs();
  updatePreview();
}

// ============================================================
// File upload
// ============================================================
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');

uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault(); uploadZone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e => handleFiles(e.target.files));

function handleFiles(files) {
  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        sourceImages.push({ file, img, name: file.name.replace(/\.[^.]+$/, '') });
        renderThumbs();
        updatePreview();
        updateGenerateBtn();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }
}

function renderThumbs() {
  const grid = document.getElementById('thumbGrid');
  grid.innerHTML = '';
  sourceImages.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'thumb-item';
    div.innerHTML = `<img src="${item.img.src}" alt="${item.name}"><button class="thumb-remove" onclick="removeImage(${i})">✕</button>`;
    div.onclick = (e) => { if (e.target.tagName !== 'BUTTON') { currentPreviewIndex = i; updatePreview(); }};
    grid.appendChild(div);
  });
  document.getElementById('uploadActions').style.display = sourceImages.length ? '' : 'none';
}

function removeImage(i) {
  sourceImages.splice(i, 1);
  if (currentPreviewIndex >= sourceImages.length) currentPreviewIndex = Math.max(0, sourceImages.length - 1);
  renderThumbs();
  updatePreview();
  updateGenerateBtn();
}

function clearAll() {
  sourceImages = [];
  currentPreviewIndex = 0;
  generatedResults = [];
  renderThumbs();
  updatePreview();
  updateGenerateBtn();
  document.getElementById('downloadSection').style.display = 'none';
  fileInput.value = '';
}

// ============================================================
// Preview tabs
// ============================================================
function updatePreviewTabs() {
  const container = document.getElementById('previewTabs');
  container.innerHTML = '';
  for (const key of selectedDevices) {
    const spec = DEVICE_SPECS[key];
    if (!spec) continue;
    const tab = document.createElement('span');
    tab.className = 'preview-tab' + (key === currentPreviewDevice ? ' active' : '');
    tab.textContent = spec.name;
    tab.onclick = () => { currentPreviewDevice = key; updatePreviewTabs(); updatePreview(); };
    container.appendChild(tab);
  }
  if (selectedDevices.size && !selectedDevices.has(currentPreviewDevice)) {
    currentPreviewDevice = [...selectedDevices][0];
    updatePreviewTabs();
  }
}

// ============================================================
// Render single screenshot to canvas
// ============================================================
function getSettings() {
  const bgHex = document.getElementById('bgColor').value;
  const useGradient = document.getElementById('useGradient').checked;
  const bgEndHex = document.getElementById('bgColorEnd').value;
  const gradientAngle = parseInt(document.getElementById('gradientAngle').value);
  return {
    bgColor: bgHex,
    useGradient,
    bgColorEnd: bgEndHex,
    gradientAngle,
    title: document.getElementById('titleText').value.trim(),
    subtitle: document.getElementById('subtitleText').value.trim(),
    titleColor: document.getElementById('titleColor').value,
    paddingRatio: parseInt(document.getElementById('padding').value) / 100,
    screenshotRatio: parseInt(document.getElementById('screenshotRatio').value) / 100,
    cornerRadius: parseInt(document.getElementById('cornerRadius').value),
    shadow: document.getElementById('showShadow').checked,
  };
}

function hexToRgb(hex) {
  hex = hex.replace('#', '');
  return [parseInt(hex.substr(0,2),16), parseInt(hex.substr(2,2),16), parseInt(hex.substr(4,2),16)];
}

function renderScreenshot(canvas, srcImg, targetSize, settings) {
  const [tw, th] = targetSize;
  canvas.width = tw;
  canvas.height = th;
  const ctx = canvas.getContext('2d');

  // Background
  if (settings.useGradient) {
    const angle = settings.gradientAngle * Math.PI / 180;
    const cx = tw / 2, cy = th / 2;
    const len = Math.sqrt(tw * tw + th * th) / 2;
    const x0 = cx - Math.cos(angle) * len, y0 = cy - Math.sin(angle) * len;
    const x1 = cx + Math.cos(angle) * len, y1 = cy + Math.sin(angle) * len;
    const grad = ctx.createLinearGradient(x0, y0, x1, y1);
    grad.addColorStop(0, settings.bgColor);
    grad.addColorStop(1, settings.bgColorEnd);
    ctx.fillStyle = grad;
  } else {
    ctx.fillStyle = settings.bgColor;
  }
  ctx.fillRect(0, 0, tw, th);

  const padding = Math.round(tw * settings.paddingRatio);
  let titleAreaH = 0;
  let availableH;

  if (settings.title) {
    availableH = Math.round(th * settings.screenshotRatio);
    titleAreaH = th - availableH;
  } else {
    availableH = th - padding * 2;
  }
  const availableW = tw - padding * 2;

  // Scale source
  const srcW = srcImg.naturalWidth || srcImg.width;
  const srcH = srcImg.naturalHeight || srcImg.height;
  const scale = Math.min(availableW / srcW, availableH / srcH);
  const newW = Math.round(srcW * scale);
  const newH = Math.round(srcH * scale);

  const x = Math.round((tw - newW) / 2);
  const y = settings.title
    ? titleAreaH + Math.round((availableH - newH) / 2)
    : Math.round((th - newH) / 2);

  const radius = Math.round(settings.cornerRadius * scale);

  // Shadow
  if (settings.shadow) {
    const off = Math.max(8, Math.round(tw * 0.005));
    const blur = Math.max(15, Math.round(tw * 0.012));
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.25)';
    ctx.shadowBlur = blur;
    ctx.shadowOffsetX = off;
    ctx.shadowOffsetY = off;
    roundRect(ctx, x, y, newW, newH, radius);
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    ctx.fill();
    ctx.restore();
  }

  // Draw screenshot with rounded corners
  ctx.save();
  roundRect(ctx, x, y, newW, newH, radius);
  ctx.clip();
  ctx.drawImage(srcImg, x, y, newW, newH);
  ctx.restore();

  // Title
  if (settings.title) {
    const titleFontSize = Math.round(tw * 0.065);
    ctx.font = `bold ${titleFontSize}px "Noto Sans CJK SC","PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif`;
    ctx.fillStyle = settings.titleColor;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const ty = Math.round(titleAreaH * 0.38);
    ctx.fillText(settings.title, tw / 2, ty);

    if (settings.subtitle) {
      const subSize = Math.round(tw * 0.04);
      ctx.font = `${subSize}px "Noto Sans CJK SC","PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif`;
      ctx.globalAlpha = 0.8;
      ctx.fillText(settings.subtitle, tw / 2, ty + titleFontSize * 0.8 + Math.round(th * 0.015));
      ctx.globalAlpha = 1;
    }
  }
}

function roundRect(ctx, x, y, w, h, r) {
  if (r <= 0) { ctx.beginPath(); ctx.rect(x, y, w, h); return; }
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ============================================================
// Preview update
// ============================================================
function updatePreview() {
  const canvas = document.getElementById('previewCanvas');
  const empty = document.getElementById('previewEmpty');

  if (!sourceImages.length || !selectedDevices.size) {
    canvas.style.display = 'none';
    empty.style.display = '';
    return;
  }
  canvas.style.display = '';
  empty.style.display = 'none';

  const spec = DEVICE_SPECS[currentPreviewDevice];
  if (!spec) return;
  const img = sourceImages[Math.min(currentPreviewIndex, sourceImages.length - 1)];
  if (!img) return;

  renderScreenshot(canvas, img.img, spec.size, getSettings());
}

// Live preview on settings change
['bgColor','bgColorEnd','titleText','subtitleText','titleColor','padding','cornerRadius','screenshotRatio','showShadow','useGradient','gradientAngle'].forEach(id => {
  const el = document.getElementById(id);
  if (!el) return;
  const evt = el.type === 'checkbox' || el.type === 'range' || el.tagName === 'SELECT' ? 'input' : 'input';
  el.addEventListener(evt, () => {
    updatePreview();
    // Sync color fields
    if (id === 'bgColor') document.getElementById('bgColorText').value = el.value;
    if (id === 'bgColorEnd') document.getElementById('bgColorEndText').value = el.value;
    if (id === 'titleColor') document.getElementById('titleColorText').value = el.value;
    if (id === 'padding') document.getElementById('paddingVal').textContent = el.value + '%';
    if (id === 'cornerRadius') document.getElementById('cornerVal').textContent = el.value + 'px';
    if (id === 'screenshotRatio') document.getElementById('ratioVal').textContent = el.value + '%';
  });
});

// Gradient toggle
document.getElementById('useGradient').addEventListener('change', e => {
  document.getElementById('gradientEndRow').style.display = e.target.checked ? '' : 'none';
});

// Sync text → color picker
['bgColorText','bgColorEndText','titleColorText'].forEach(id => {
  document.getElementById(id).addEventListener('input', e => {
    const val = e.target.value;
    if (/^#[0-9a-fA-F]{6}$/.test(val)) {
      const pickerId = id.replace('Text', '');
      document.getElementById(pickerId).value = val;
      updatePreview();
    }
  });
});

// Color presets
document.querySelectorAll('.color-preset').forEach(el => {
  el.addEventListener('click', () => {
    const color = el.dataset.color;
    document.getElementById('bgColor').value = color;
    document.getElementById('bgColorText').value = color;
    updatePreview();
  });
});

function updateGenerateBtn() {
  document.getElementById('generateBtn').disabled = !sourceImages.length || !selectedDevices.size;
}

// ============================================================
// Batch generate
// ============================================================
async function generateAll() {
  if (!sourceImages.length || !selectedDevices.size) return;

  const settings = getSettings();
  const devices = [...selectedDevices];
  const total = sourceImages.length * devices.length;
  let count = 0;
  generatedResults = [];

  const bar = document.getElementById('progressBar');
  const fill = document.getElementById('progressFill');
  const text = document.getElementById('progressText');
  bar.classList.add('show');
  text.classList.add('show');
  document.getElementById('generateBtn').disabled = true;

  const offscreen = document.createElement('canvas');

  for (const deviceKey of devices) {
    const spec = DEVICE_SPECS[deviceKey];
    if (!spec) continue;
    for (const item of sourceImages) {
      renderScreenshot(offscreen, item.img, spec.size, settings);
      const blob = await new Promise(resolve => offscreen.toBlob(resolve, 'image/png'));
      const dataUrl = offscreen.toDataURL('image/png');
      generatedResults.push({ deviceKey, imgName: item.name, blob, dataUrl });
      count++;
      fill.style.width = (count / total * 100) + '%';
      text.textContent = `${count} / ${total}`;
      // Yield to UI
      await new Promise(r => setTimeout(r, 10));
    }
  }

  bar.classList.remove('show');
  text.classList.remove('show');
  document.getElementById('generateBtn').disabled = false;
  document.getElementById('downloadSection').style.display = '';
  showToast(`生成完成！共 ${count} 张截图`, 'success');
  trackTool('generate');
}

// ============================================================
// Download
// ============================================================
function downloadCurrent() {
  const canvas = document.getElementById('previewCanvas');
  if (!canvas.width) return;
  const link = document.createElement('a');
  const spec = DEVICE_SPECS[currentPreviewDevice];
  const imgName = sourceImages[currentPreviewIndex]?.name || 'screenshot';
  link.download = `${currentPreviewDevice}_${imgName}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

async function downloadAll() {
  if (!generatedResults.length) {
    showToast('请先点击「生成截图」', 'error');
    return;
  }
  if (typeof JSZip === 'undefined') {
    showToast('ZIP 库加载中，请稍后重试', 'error');
    return;
  }
  const zip = new JSZip();
  for (const r of generatedResults) {
    const folder = zip.folder(r.deviceKey);
    folder.file(`${r.imgName}.png`, r.blob);
  }
  const content = await zip.generateAsync({ type: 'blob' });
  const link = document.createElement('a');
  link.download = 'appstore_screenshots.zip';
  link.href = URL.createObjectURL(content);
  link.click();
  URL.revokeObjectURL(link.href);
  trackTool('export');
}

// ============================================================
// Toast
// ============================================================
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.className = `toast toast-${type} show`;
  t.textContent = msg;
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ============================================================
// Auth check
// ============================================================
async function checkAuth() {
  const token = localStorage.getItem('kotabi_token');
  const refresh = localStorage.getItem('kotabi_refresh');
  if (!token) { showGate(); return; }

  try {
    const headers = { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
    let res = await fetch('/api/v1/auth/me', { headers });
    if (res.status === 401 && refresh) {
      const rr = await fetch('/api/v1/auth/refresh', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refreshToken: refresh })
      });
      if (rr.ok) {
        const rd = await rr.json();
        localStorage.setItem('kotabi_token', rd.accessToken);
        res = await fetch('/api/v1/auth/me', { headers: { 'Authorization': 'Bearer ' + rd.accessToken } });
      } else { showGate(); return; }
    }
    if (!res.ok) { showGate(); return; }
    const data = await res.json();
    const user = data.user;
    // Show user badge
    const badge = document.getElementById('userBadge');
    badge.classList.add('show');
    badge.textContent = user.username || user.email;
    document.getElementById('loginBtn').style.display = 'none';
    // Show main content
    document.getElementById('authGate').style.display = 'none';
    document.getElementById('mainContent').style.display = '';
    initDeviceChips();
    updatePreviewTabs();
    updateGenerateBtn();
    trackTool('open', token);
  } catch { showGate(); }
}

function trackTool(action, tokenOpt) {
  try {
    const t = tokenOpt || localStorage.getItem('kotabi_token');
    const headers = { 'Content-Type': 'application/json' };
    if (t) headers['Authorization'] = 'Bearer ' + t;
    fetch('/api/v1/tools/track', {
      method: 'POST', headers, keepalive: true,
      body: JSON.stringify({ tool_id: 'screenshot-generator', action: action || 'open' }),
    }).catch(() => {});
  } catch (_) {}
}

function showGate() {
  document.getElementById('authGate').style.display = '';
  document.getElementById('mainContent').style.display = 'none';
  document.getElementById('loginBtn').style.display = '';
  document.getElementById('loginBtn').href = '/tools';
}

checkAuth();
</script>
