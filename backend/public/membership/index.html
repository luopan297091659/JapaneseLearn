<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会员订阅 — 言旅 Kotabi</title>

<style>
:root {
  --primary: #4361ee;
  --primary-dark: #2f4ac1;
  --primary-light: #eef0fd;
  --surface: #ffffff;
  --surface2: #f8f9fc;
  --border: #e5e7ef;
  --text: #1a1c2e;
  --text-sub: #6b7280;
  --text-hint: #9ca3af;
  --radius: 16px;
  --radius-sm: 8px;
  --shadow: 0 2px 16px rgba(67,97,238,.08);
  --shadow-md: 0 4px 24px rgba(67,97,238,.13);
  --nav-h: 56px;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif; color: var(--text); background: var(--surface2); line-height: 1.6; }
a { text-decoration: none; color: var(--primary); }

/* ── Nav ── */
nav {
  position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h);
  background: rgba(255,255,255,.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border); display: flex; align-items: center;
  padding: 0 clamp(12px,4vw,48px); gap: 8px; z-index: 100;
}
nav .logo { font-size: 20px; font-weight: 800; color: var(--primary); cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
nav .logo img { width: 32px; height: 32px; border-radius: 8px; }
nav .logo sub { font-size: 11px; font-weight: 400; color: var(--text-sub); margin-left: 2px; vertical-align: baseline; }
nav .spacer { flex: 1; }
nav .nav-link { font-size: 13px; font-weight: 600; color: var(--text-sub); padding: 5px 10px; border-radius: var(--radius-sm); transition: all .15s; white-space: nowrap; }
nav .nav-link:hover { color: var(--primary); background: var(--primary-light); }
nav .nav-link.active { color: var(--primary); }
.user-account { display: none; flex-direction: column; align-items: center; position: relative; }
.user-account.show { display: flex; }
.user-badge { font-size: 13px; font-weight: 600; color: var(--primary); padding: 5px 12px; border-radius: var(--radius-sm); background: var(--primary-light); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.user-badge .vip-icon { font-size: 14px; margin-right: 2px; }
.user-badge.is-member { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #92400e; }
.user-sub { font-size: 10px; color: var(--text-sub); white-space: nowrap; margin-top: 1px; }

/* ── Hero section ── */
.membership-hero {
  margin-top: var(--nav-h); padding: 48px 20px 32px; text-align: center;
  background: linear-gradient(135deg, #0f0c29, #1a1a4e, #24243e); color: #fff;
}
.membership-hero h1 { font-size: clamp(22px,4vw,36px); font-weight: 900; margin-bottom: 8px; }
.membership-hero h1 span { background: linear-gradient(90deg,#60a5fa,#a78bfa,#f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.membership-hero p { font-size: 15px; color: rgba(255,255,255,.7); max-width: 500px; margin: 0 auto; }

/* ── Plans ── */
.plans-section { max-width: 900px; margin: -24px auto 0; padding: 0 16px 48px; position: relative; z-index: 1; }
.plans-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
.plan-card {
  background: var(--surface); border-radius: var(--radius); padding: 28px 24px;
  box-shadow: var(--shadow); transition: transform .2s, box-shadow .2s; position: relative; display: flex; flex-direction: column;
}
.plan-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.plan-card.popular { border: 2px solid var(--primary); }
.plan-card.popular::before {
  content: '推荐'; position: absolute; top: -11px; right: 20px;
  background: var(--primary); color: #fff; font-size: 11px; font-weight: 700;
  padding: 2px 12px; border-radius: 10px;
}
.plan-name { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
.plan-price { font-size: 32px; font-weight: 900; color: var(--primary); margin: 8px 0; }
.plan-price small { font-size: 14px; font-weight: 500; color: var(--text-sub); }
.plan-desc { font-size: 13px; color: var(--text-sub); margin-bottom: 16px; }
.plan-features { list-style: none; flex: 1; margin-bottom: 20px; }
.plan-features li { font-size: 13px; padding: 4px 0; display: flex; align-items: center; gap: 6px; }
.plan-features li::before { content: '✓'; color: var(--success); font-weight: 700; font-size: 14px; }
.plan-btn {
  display: block; width: 100%; padding: 11px; border: none; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 700; cursor: pointer; transition: all .2s; text-align: center;
}
.plan-btn-primary { background: var(--primary); color: #fff; }
.plan-btn-primary:hover { background: var(--primary-dark); }
.plan-btn-secondary { background: var(--primary-light); color: var(--primary); }
.plan-btn-secondary:hover { background: #dde0f8; }
.plan-btn:disabled { opacity: .5; cursor: not-allowed; }

/* ── Feature comparison ── */
.comparison { max-width: 800px; margin: 0 auto 48px; padding: 0 16px; }
.comparison h2 { text-align: center; font-size: 22px; font-weight: 800; margin-bottom: 20px; }
.comparison table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.comparison th, .comparison td { padding: 12px 16px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--border); }
.comparison th { background: var(--surface2); font-weight: 700; }
.comparison td:nth-child(2), .comparison td:nth-child(3) { text-align: center; }
.comparison th:nth-child(2), .comparison th:nth-child(3) { text-align: center; }
.check { color: var(--success); font-weight: 700; }
.limit { color: var(--warning); font-size: 12px; }



/* ── Auth Modal ── */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.5); z-index: 200; align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--surface); border-radius: var(--radius); padding: 32px 28px;
  width: 100%; max-width: 400px; margin: 16px; box-shadow: 0 8px 40px rgba(0,0,0,.2);
}
.modal h2 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
.modal .subtitle { font-size: 13px; color: var(--text-sub); margin-bottom: 20px; }
.modal .tabs { display: flex; gap: 4px; margin-bottom: 20px; }
.modal .tab {
  flex: 1; padding: 8px; text-align: center; font-size: 13px; font-weight: 600;
  border: none; background: var(--surface2); color: var(--text-sub);
  border-radius: var(--radius-sm); cursor: pointer; transition: all .15s;
}
.modal .tab.active { background: var(--primary); color: #fff; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: var(--text-sub); }
.form-group input {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 14px; outline: none; transition: border .15s;
}
.form-group input:focus { border-color: var(--primary); }
.form-error { font-size: 12px; color: var(--danger); margin-top: 16px; display: none; text-align: center; }
.form-error.show { display: block; }
.modal-btn {
  width: 100%; padding: 11px; border: none; border-radius: var(--radius-sm);
  background: var(--primary); color: #fff; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all .15s; margin-top: 6px;
}
.modal-btn:hover { background: var(--primary-dark); }
.modal-btn:disabled { opacity: .6; cursor: not-allowed; }
.modal-close {
  position: absolute; top: 10px; right: 14px; background: none; border: none;
  font-size: 20px; color: var(--text-hint); cursor: pointer;
}

/* ── Toast ── */
.toast {
  position: fixed; top: 72px; left: 50%; transform: translateX(-50%);
  padding: 10px 20px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600;
  color: #fff; z-index: 300; opacity: 0; transition: opacity .3s;
}
.toast.show { opacity: 1; }
.toast-success { background: var(--success); }
.toast-error { background: var(--danger); }

/* ── Footer ── */
footer { text-align: center; padding: 28px 16px; font-size: 12px; color: var(--text-hint); border-top: 1px solid var(--border); }

/* ── Loading spinner on button ── */
.btn-loading { pointer-events: none; opacity: .7; }
.spinner-sm { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 4px; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 480px) {
  .plans-grid { grid-template-columns: 1fr; }
  .comparison table { font-size: 12px; }
  .comparison th, .comparison td { padding: 8px 10px; }
}
</style>

<script>
const API = '/api/v1';

// ── Token & User State ──
let accessToken = localStorage.getItem('kotabi_token');
let refreshTokenStr = localStorage.getItem('kotabi_refresh');
let currentUser = null;
let pendingPlanId = null; // plan to buy after login

async function apiCall(method, path, body, raw) {
  const headers = {};
  if (accessToken) headers['Authorization'] = 'Bearer ' + accessToken;
  if (!raw) headers['Content-Type'] = 'application/json';
  const opts = { method, headers };
  if (body && method !== 'GET') opts.body = JSON.stringify(body);
  let res = await fetch(API + path, opts);
  // try refresh
  if (res.status === 401 && refreshTokenStr) {
    const rr = await fetch(API + '/auth/refresh', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refreshToken: refreshTokenStr })
    });
    if (rr.ok) {
      const rd = await rr.json();
      accessToken = rd.accessToken;
      localStorage.setItem('kotabi_token', accessToken);
      headers['Authorization'] = 'Bearer ' + accessToken;
      res = await fetch(API + path, { method, headers, body: opts.body });
    } else {
      logout();
      throw new Error('SESSION_EXPIRED');
    }
  }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || data.message || 'Request failed');
  return data;
}

function logout() {
  accessToken = null; refreshTokenStr = null; currentUser = null;
  localStorage.removeItem('kotabi_token');
  localStorage.removeItem('kotabi_refresh');
  updateUI();
}

// ── Auth Modal ──
let authMode = 'login';
function showAuthModal() {
  document.getElementById('authModal').classList.add('show');
  document.getElementById('authError').classList.remove('show');
  switchTab('login');
}
function closeAuthModal() {
  document.getElementById('authModal').classList.remove('show');
  pendingPlanId = null;
}
function switchTab(mode) {
  authMode = mode;
  document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
  document.getElementById('tabCodeLogin').classList.toggle('active', mode === 'codeLogin');
  document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
  document.getElementById('usernameGroup').style.display = mode === 'register' ? '' : 'none';
  document.getElementById('inviteCodeGroup').style.display = mode === 'register' ? '' : 'none';
  document.getElementById('passwordGroup').style.display = mode === 'codeLogin' ? 'none' : '';
  document.getElementById('loginCodeGroup').style.display = mode === 'codeLogin' ? '' : 'none';
  document.getElementById('forgotLink').style.display = mode === 'codeLogin' ? 'none' : '';
  document.getElementById('authSubmitBtn').textContent = mode === 'register' ? '注册' : '登录';
  document.getElementById('authTitle').textContent = mode === 'register' ? '注册账号' : '登录账号';
  document.getElementById('authError').classList.remove('show');
}

function appendEmailSuffix(suffix) {
  if (!suffix) return;
  const input = document.getElementById('authEmail');
  const at = input.value.indexOf('@');
  const prefix = at >= 0 ? input.value.substring(0, at) : input.value;
  input.value = prefix + suffix;
  input.focus();
}
function appendResetSuffix(suffix) {
  if (!suffix) return;
  const input = document.getElementById('resetEmail');
  const at = input.value.indexOf('@');
  const prefix = at >= 0 ? input.value.substring(0, at) : input.value;
  input.value = prefix + suffix;
  input.focus();
}

let forgotStep = 0;
function showForgotPassword() {
  document.getElementById('authForm').style.display = 'none';
  document.getElementById('forgotLink').style.display = 'none';
  document.getElementById('forgotForm').style.display = '';
  document.getElementById('authTitle').textContent = '重置密码';
  document.getElementById('authSubtitle').textContent = '输入邮箱发送验证码';
  forgotStep = 0;
}
function backToLogin() {
  document.getElementById('authForm').style.display = '';
  document.getElementById('forgotLink').style.display = '';
  document.getElementById('forgotForm').style.display = 'none';
  document.getElementById('resetCodeGroup').style.display = 'none';
  document.getElementById('resetPwdGroup').style.display = 'none';
  document.getElementById('resetError').classList.remove('show');
  switchTab('login');
}
async function handleForgotPassword() {
  const btn = document.getElementById('resetBtn');
  const errEl = document.getElementById('resetError');
  errEl.classList.remove('show');
  btn.disabled = true;
  try {
    if (forgotStep === 0) {
      const email = document.getElementById('resetEmail').value.trim();
      if (!email) throw new Error('请输入邮箱');
      btn.textContent = '发送中...';
      const r = await fetch(API + '/auth/forgot-password', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email }) });
      if (!r.ok) { const d = await r.json(); throw new Error(d.error || '发送失败'); }
      forgotStep = 1;
      document.getElementById('resetCodeGroup').style.display = '';
      document.getElementById('resetPwdGroup').style.display = '';
      document.getElementById('authSubtitle').textContent = '验证码已发送至邮箱';
      btn.textContent = '重置密码';
    } else {
      const email = document.getElementById('resetEmail').value.trim();
      const code = document.getElementById('resetCode').value.trim();
      const newPassword = document.getElementById('resetNewPwd').value;
      if (!code || !newPassword) throw new Error('请填写验证码和新密码');
      if (newPassword.length < 8) throw new Error('密码至少 8 位');
      btn.textContent = '重置中...';
      const r = await fetch(API + '/auth/reset-password', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email, code, newPassword }) });
      if (!r.ok) { const d = await r.json(); throw new Error(d.error || '重置失败'); }
      showToast('密码重置成功，请重新登录');
      backToLogin();
    }
  } catch (e) {
    errEl.textContent = e.message;
    errEl.classList.add('show');
  } finally {
    btn.disabled = false;
    if (forgotStep === 0) btn.textContent = '发送验证码';
  }
}

let _loginCodeCountdown = 0;
async function sendLoginCodeWeb() {
  const email = document.getElementById('authEmail').value.trim();
  if (!email) { showToast('请输入邮箱', 'error'); return; }
  const btn = document.getElementById('sendLoginCodeBtn');
  btn.disabled = true; btn.textContent = '发送中...';
  try {
    const r = await fetch(API + '/auth/send-login-code', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email }) });
    if (!r.ok) { const d = await r.json(); throw new Error(d.error || '发送失败'); }
    showToast('验证码已发送', 'success');
    _loginCodeCountdown = 60;
    const iv = setInterval(() => {
      _loginCodeCountdown--;
      btn.textContent = _loginCodeCountdown + 's';
      if (_loginCodeCountdown <= 0) { clearInterval(iv); btn.disabled = false; btn.textContent = '重新发送'; }
    }, 1000);
  } catch (e) { showToast(e.message, 'error'); btn.disabled = false; btn.textContent = '发送验证码'; }
}

async function handleAuth(e) {
  e.preventDefault();
  document.getElementById('emailSuffix').value = '';
  const btn = document.getElementById('authSubmitBtn');
  const errEl = document.getElementById('authError');
  errEl.classList.remove('show');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-sm"></span>' + (authMode === 'register' ? '注册中...' : '登录中...');
  try {
    const email = document.getElementById('authEmail').value.trim();
    let data;
    if (authMode === 'register') {
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('authPassword').value;
      const inviteCode = document.getElementById('regInviteCode').value.trim();
      if (!username || username.length < 3) throw new Error('用户名至少 3 个字符');
      const regData = { username, email, password, platform: 'web' };
      if (inviteCode) regData.invite_code = inviteCode;
      data = await apiCall('POST', '/auth/register', regData);
    } else if (authMode === 'codeLogin') {
      const code = document.getElementById('loginCode').value.trim();
      if (!code) throw new Error('请输入验证码');
      data = await apiCall('POST', '/auth/login-with-code', { email, code, platform: 'web' });
    } else {
      const password = document.getElementById('authPassword').value;
      data = await apiCall('POST', '/auth/login', { email, password, platform: 'web' });
    }
    accessToken = data.accessToken;
    refreshTokenStr = data.refreshToken;
    localStorage.setItem('kotabi_token', accessToken);
    localStorage.setItem('kotabi_refresh', refreshTokenStr);
    currentUser = data.user;
    const pid = pendingPlanId;
    closeAuthModal();
    // 登录/注册后重新拉取完整用户信息（含 invite_count）
    loadUser();
    showToast(authMode === 'register' ? '注册成功' : '登录成功', 'success');
    if (pid) {
      startCheckout(pid);
    }
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = authMode === 'login' ? '登录' : '注册';
  }
}

// ── User Menu ──
function showUserMenu() {
  if (confirm('确定退出登录？')) logout();
}

// ── Plan Rank（等级，越高越尊贵；同级或低级套餐对当前用户置灰）──
const PLAN_RANK = { monthly: 1, yearly: 2, lifetime: 3 };
function planRankOf(planId) { return PLAN_RANK[planId] || 0; }
function currentUserRank() {
  if (!currentUser || !currentUser.is_member) return 0;
  // 体验会员（trial）视为无等级，可开通任意付费套餐
  if (currentUser.is_trial || currentUser.membership_plan === 'trial') return 0;
  return planRankOf(currentUser.membership_plan);
}
let _plansCache = [];

// ── Load Plans ──
async function loadPlans() {
  try {
    const data = await fetch(API + '/sync/membership-plans').then(r => r.json());
    const plans = (data.plans || []).filter(p => p.enabled);
    _plansCache = plans;
    renderPlans(plans);
  } catch {
    _plansCache = [
      { id: 'monthly', name: '月度会员', price: 18, period: 'month', features: ['全功能解锁', '所有功能无限制使用', 'AI 对话 · 发音评测', '错题集 · 学习计划'], description: '按月订阅，灵活选择' },
      { id: 'yearly', name: '年度会员', price: 128, period: 'year', features: ['全功能解锁', '所有功能无限制使用', 'AI 对话 · 发音评测', '错题集 · 学习计划', '比月付节省 41%'], description: '年度订阅，最高性价比' },
    ];
    renderPlans(_plansCache);
  }
}

function renderPlans(plans) {
  const grid = document.getElementById('plansGrid');
  grid.innerHTML = '';
  // free card
    // grid.innerHTML += `
     //  <div class="plan-card">
     //    <div class="plan-name">免费版</div>
      //   <div class="plan-price">¥0</div>
      //   <div class="plan-desc">基础学习功能，适合入门体验</div>
       //  <ul class="plan-features">
       //    <li>五十音学习</li>
       //    <li>都道府县测验</li>
        //   //   <li>部分功能有每日次数限制</li>
         //  <li>AI·发音·Anki 等高级功能不可用</li>
       //  </ul>
       //  <button class="plan-btn plan-btn-secondary" disabled>当前使用中</button>
     //  </div>
    // `;
  const userRank = currentUserRank();
  const userPlanId = currentUser && currentUser.is_member ? currentUser.membership_plan : null;
  plans.forEach((p, i) => {
    const isPopular = p.id === 'yearly' || (plans.length === 1 && i === 0);
    const periodLabel = { month: '/月', year: '/年', forever: ' 终身' }[p.period] || '';
    const features = Array.isArray(p.features) && p.features.length
      ? p.features
      : ['全功能解锁', '所有功能无限制使用', 'AI 对话 · 发音评测', '错题集 · 学习计划'];
    const pRank = planRankOf(p.id);
    const isCurrent = userPlanId === p.id;
    const isLowerOrEqual = userRank > 0 && pRank > 0 && pRank <= userRank;
    const disabled = isLowerOrEqual;
    let btnLabel = '立即开通';
    if (isCurrent) btnLabel = '当前套餐';
    else if (disabled) btnLabel = '已不可降级';
    const btnHtml = disabled
      ? `<button class="plan-btn plan-btn-primary" disabled style="opacity:.5;cursor:not-allowed;background:#9ca3af;">${btnLabel}</button>`
      : `<button class="plan-btn plan-btn-primary" onclick="handleBuy('${esc(p.id)}')">${btnLabel}</button>`;
    grid.innerHTML += `
      <div class="plan-card ${isPopular ? 'popular' : ''} ${isCurrent ? 'current' : ''}">
        <div class="plan-name">${esc(p.name)}</div>
        <div class="plan-price">¥${p.price}<small>${periodLabel}</small></div>
        <div class="plan-desc">${esc(p.description || '')}</div>
        <ul class="plan-features">
          ${features.map(f => '<li>' + esc(String(f)) + '</li>').join('')}
        </ul>
        ${btnHtml}
      </div>
    `;
  });
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ── Buy Flow ──
function handleBuy(planId) {
  if (!accessToken || !currentUser) {
    pendingPlanId = planId;
    showAuthModal();
    return;
  }
  startCheckout(planId);
}

async function startCheckout(planId) {
  const btns = document.querySelectorAll('.plan-btn-primary');
  btns.forEach(b => { b.disabled = true; b.classList.add('btn-loading'); });
  try {
    const data = await apiCall('POST', '/stripe/create-checkout-session', { planId });
    if (data.url) {
      window.location.href = data.url;
    } else {
      showToast('无法创建支付会话', 'error');
    }
  } catch (err) {
    showToast(err.message || '支付请求失败', 'error');
  } finally {
    btns.forEach(b => { b.disabled = false; b.classList.remove('btn-loading'); });
  }
}

// ── Check Payment Status ──
async function checkPaymentStatus() {
  const params = new URLSearchParams(location.search);
  const status = params.get('status');
  const sessionId = params.get('session_id');
  if (status === 'success' && sessionId) {
    showToast('支付成功！会员已开通', 'success');
    // refresh user info
    try { await loadUser(); } catch {}
    // clean URL
    history.replaceState(null, '', '/membership');
  } else if (status === 'cancel') {
    showToast('支付已取消', 'error');
    history.replaceState(null, '', '/membership');
  }
}

// ── Load User ──
async function loadUser() {
  if (!accessToken) return;
  try {
    const data = await apiCall('GET', '/auth/me');
    currentUser = data.user;
    updateUI();
  } catch {
    logout();
  }
}

// ── Update UI ──
function updateUI() {
  const loginBtn = document.getElementById('loginBtn');
  const badge = document.getElementById('userBadge');
  const account = document.getElementById('userAccount');

  if (currentUser) {
    loginBtn.style.display = 'none';
    account.classList.add('show');
    if (currentUser.is_member) {
      badge.classList.add('is-member');
      badge.innerHTML = '<span class="vip-icon">👑</span>' + esc(currentUser.username || currentUser.email);
    } else {
      badge.classList.remove('is-member');
      badge.textContent = currentUser.username || currentUser.email;
    }
  } else {
    loginBtn.style.display = '';
    account.classList.remove('show');
  }
  // 用户状态变化后重渲染套餐按钮（控制可开通状态）
  if (_plansCache && _plansCache.length) renderPlans(_plansCache);
}

function copyInviteCode() {
  if (!currentUser || !currentUser.invite_code) return;
  navigator.clipboard.writeText(currentUser.invite_code).then(() => {
    showToast('邀请码已复制: ' + currentUser.invite_code, 'success');
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = currentUser.invite_code;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('邀请码已复制: ' + currentUser.invite_code, 'success');
  });
}

// ── Toast ──
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast toast-' + type + ' show';
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Load Feature Tiers (dynamic comparison table) ──
async function loadTiers() {
  try {
    const data = await fetch(API + '/sync/tiers').then(r => r.json());
    const tiers = data.tiers || [];
    if (!tiers.length) return;
    const tbody = document.getElementById('comparisonBody');
    // keep the first two static rows (五十音 + 都道府県)
    const staticRows = tbody.querySelectorAll('tr');
    const fragment = document.createDocumentFragment();
    staticRows.forEach(r => fragment.appendChild(r.cloneNode(true)));
    tiers.forEach(t => {
      const tr = document.createElement('tr');
      const tdName = document.createElement('td');
      tdName.textContent = (t.icon || '') + ' ' + t.name;
      tr.appendChild(tdName);
      const tdFree = document.createElement('td');
      tdFree.style.textAlign = 'center';
      if (t.type === 'blocked') {
        tdFree.textContent = '—';
      } else {
        tdFree.textContent = t.free_label;
        tdFree.className = 'limit';
      }
      tr.appendChild(tdFree);
      const tdMember = document.createElement('td');
      tdMember.style.textAlign = 'center';
      tdMember.className = 'check';
      tdMember.textContent = t.member_label;
      tr.appendChild(tdMember);
      fragment.appendChild(tr);
    });
    tbody.innerHTML = '';
    tbody.appendChild(fragment);
  } catch {}
}

// ── Init ──
(async function init() {
  loadPlans();
  loadTiers();
  if (accessToken) await loadUser();
  updateUI();
  checkPaymentStatus();
})();
</script>
