workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    # working_directory: mobile
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - android/.gradle
    environment:
      # flutter: stable
      java: 17
      flutter: 3.27.4
      xcode: latest   # 或者指定和该 Flutter 版本兼容的 Xcode
      cocoapods: default
    scripts:
      - name: Bump version
        script: |
          #!/bin/bash
          ver=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          name="${ver%%+*}"
          major=$(echo "$name" | awk -F. '{print $1}')
          minor=$(echo "$name" | awk -F. '{print $2}')
          patch=$(echo "$name" | awk -F. '{print $3}')
          new_patch=$((patch+1))
          new_build="${major}${minor}${new_patch}"
          new_ver="${major}.${minor}.${new_patch}+${new_build}"
          sed -i.bak "s/^version: .*/version: $new_ver/" pubspec.yaml
          echo "New version: $new_ver"
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release --dart-define=ENV=prod | tee build_log_android.txt
    artifacts:
      - build/app/outputs/**/*.apk
      - build_log_android.txt

  ios-workflow:
    name: iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    cache:
      cache_paths:
        - $HOME/.pub-cache
    integrations:
      # app_store_connect: app-publish
      app_store_connect: kotabi_test

    environment:
      # flutter: stable
      # xcode: latest
      # cocoapods: default
      flutter: 3.27.4
      xcode: latest   # 或者指定和该 Flutter 版本兼容的 Xcode
      cocoapods: default
      groups:
        - shorebird
      vars:
        FLUTTER_VERSION: 3.27.4
      ios_signing:
        distribution_type: app_store
        # bundle_identifier: com.kotabi.app
        bundle_identifier: com.kotabi.app
    scripts:
      - name: Bump version
        script: |
          #!/bin/bash
          ver=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          name="${ver%%+*}"
          major=$(echo "$name" | awk -F. '{print $1}')
          minor=$(echo "$name" | awk -F. '{print $2}')
          patch=$(echo "$name" | awk -F. '{print $3}')
          new_patch=$((patch+1))
          new_build="${major}${minor}${new_patch}"
          new_ver="${major}.${minor}.${new_patch}+${new_build}"
          sed -i.bak "s/^version: .*/version: $new_ver/" pubspec.yaml
          echo "New version: $new_ver"
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install Shorebird
        script: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://shorebird.dev/install.sh | bash
          echo 'PATH="$HOME/.shorebird/bin:$PATH"' >> "$CM_ENV"
      - name: Install CocoaPods dependencies
        script: |
          set -euo pipefail
          cd ios
          pod install
      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          set -euo pipefail
          shorebird release ios \
            --flutter-version="$FLUTTER_VERSION" \
            --dart-define=ENV=prod \
            --export-options-plist=/Users/builder/export_options.plist \
            2>&1 | tee build_log_ios.txt

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - build_log_ios.txt

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
